<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RelayWeen 2026 - Concurso de Disfraces</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería de Confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Fuente Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #3b0764 0%, #0f172a 60%, #020617 100%);
      min-height: 100vh;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .swipe-card {
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease;
    }
    .swipe-card.dragging {
      transition: none !important;
      cursor: grabbing !important;
    }
    .next-card-preview {
      transform: scale(0.93) translateY(18px);
      opacity: 0.55;
      filter: blur(1px);
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="pb-12 flex flex-col min-h-screen">

  <header class="border-b border-white/10 bg-slate-950/60 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div id="headerLogoContainer" class="flex items-center justify-center rounded-xl transition"></div>
        <div>
          <h1 class="text-lg md:text-2xl font-extrabold tracking-tight bg-gradient-to-r from-orange-400 via-amber-300 to-purple-400 bg-clip-text text-transparent">
            RelayWeen 2026
          </h1>
          <p class="text-[11px] text-slate-400" id="statusSubtitle">Sincronizado en la nube • Desliza para ver a los participantes</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="totalVotesBadge" class="text-xs font-semibold px-3 py-1 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">0 votos</span>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 mt-4 flex flex-col justify-center">
    <section id="votingView" class="w-full">
      <div id="activeVotingContainer" class="max-w-md mx-auto w-full flex flex-col items-center">
        <div class="w-full flex items-center justify-between mb-2.5 px-1">
          <span id="cardCounterBadge" class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-slate-800 text-amber-300 border border-slate-700">1 / 32</span>
        </div>
        <div class="relative w-full h-[460px] sm:h-[510px] flex items-center justify-center select-none">
          <div id="mainSwipeCard" class="swipe-card relative w-full h-full rounded-3xl overflow-hidden bg-slate-900 border-2 border-white/15 shadow-2xl cursor-grab flex flex-col justify-end p-6">
            <h2 id="activeCardName" class="text-2xl font-extrabold text-white">Cargando...</h2>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBM6w_S_s2T0HdQV9PAlVbGDiSnVegixg0",
      authDomain: "rhc-custome-parade.firebaseapp.com",
      projectId: "rhc-custome-parade",
      storageBucket: "rhc-custome-parade.firebasestorage.app",
      messagingSenderId: "678460812984",
      appId: "1:678460812984:web:4a687202e7dddb7c370e4d",
      measurementId: "G-J2EXLB2R96"
    };

    const app = initializeApp(firebaseConfig);
    console.log("Firebase inicializado correctamente:", app.name);
  </script>
</body>
</html>
